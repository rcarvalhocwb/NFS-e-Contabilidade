services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: nfse
      POSTGRES_PASSWORD: nfse
      POSTGRES_DB: nfse_gateway
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  gateway:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://nfse:nfse@db:5432/nfse_gateway
      PORT: 3000
    env_file:
      - .env
    ports:
      - "3000:3000"

volumes:
  pgdata:
