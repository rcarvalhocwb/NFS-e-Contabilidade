<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emitir NFS-e</title>
<link rel="stylesheet" href="/assets/app.css">
<style>
  /* Nomes locais mapeados para o design system, para o chat herdar a paleta da
     marca (inclusive o modo escuro) sem reescrever as regras abaixo.
     --bg, --ok e --ok-bg já vêm de app.css com o mesmo significado. */
  :root {
    --card: var(--superficie);
    --fg: var(--texto);
    --muted: var(--texto-2);
    --line: var(--linha);
    --accent: var(--acento);
    --accent-fg: var(--acento-fg);
    --warn: var(--alerta);  --warn-bg: var(--alerta-bg);
    --err:  var(--erro);    --err-bg:  var(--erro-bg);
    --bolha: var(--superficie-2);
  }
  /* Texto maior que o do painel: aqui se lê e responde, não se consulta tabela */
  body { font-size:16px; }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:11px 20px;
           display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:10; }
  header .logo { width:32px; height:32px; border-radius:8px; background:var(--acento);
                 color:#fff; display:grid; place-items:center; font-weight:700; font-size:13px; }
  header h1 { font-size:16px; margin:0; font-weight:650; letter-spacing:-.2px; }
  header .sub { font-size:12px; color:var(--texto-3); }
  .spacer { flex:1; }
  a.link { color:var(--accent); text-decoration:none; font-size:14px; }
  main { max-width:760px; margin:0 auto; padding:20px 16px 140px; }

  .msg-bot, .msg-user { margin-bottom:14px; display:flex; }
  .msg-user { justify-content:flex-end; }
  .bolha { max-width:80%; padding:12px 16px; border-radius:14px; }
  .msg-bot .bolha { background:var(--bolha); border-bottom-left-radius:4px; }
  .msg-user .bolha { background:var(--accent); color:var(--accent-fg); border-bottom-right-radius:4px; }
  .bolha .sub { font-size:13px; color:var(--muted); margin-top:4px; }
  .msg-user .bolha .sub { color:rgba(255,255,255,.85); }

  .opcoes { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 16px 2px; }
  .opcoes button { font:inherit; font-size:14px; border:1px solid var(--line); background:var(--card);
                   color:var(--fg); padding:9px 14px; border-radius:20px; cursor:pointer; text-align:left; }
  .opcoes button:hover { border-color:var(--accent); color:var(--accent); }
  .opcoes button .det { display:block; font-size:12px; color:var(--muted); }

  .entrada { position:fixed; bottom:0; left:0; right:0; background:var(--card);
             border-top:1px solid var(--line); padding:14px 16px; }
  .entrada-inner { max-width:760px; margin:0 auto; display:flex; gap:10px; }
  .entrada input { flex:1; font:inherit; padding:12px 14px; border-radius:10px;
                   border:1px solid var(--line); background:var(--bg); color:var(--fg); }
  .entrada input:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  .entrada button { font:inherit; border:0; background:var(--accent); color:var(--accent-fg);
                    padding:12px 22px; border-radius:10px; cursor:pointer; font-weight:600; }
  .entrada button:disabled { opacity:.5; cursor:not-allowed; }
  .dica { max-width:760px; margin:8px auto 0; font-size:12px; color:var(--muted); }

  .resumo { background:var(--card); border:1px solid var(--line); border-radius:12px;
            padding:16px; margin:6px 0 16px; }
  .resumo h3 { margin:0 0 12px; font-size:15px; }
  .resumo dl { display:grid; grid-template-columns:auto 1fr; gap:6px 14px; margin:0; font-size:14px; }
  .resumo dt { color:var(--muted); }
  .resumo dd { margin:0; }
  .resumo .total { margin-top:12px; padding-top:12px; border-top:1px solid var(--line);
                   font-size:18px; font-weight:650; }

  .tag { display:inline-block; padding:2px 9px; border-radius:20px; font-size:12px; font-weight:600; }
  .tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.err{background:var(--err-bg);color:var(--err)}
  .tag.warn{background:var(--warn-bg);color:var(--warn)}
  .mono { font-family:ui-monospace,Consolas,monospace; font-size:13px; word-break:break-all; }
  .acoes-nota { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .acoes-nota a { font-size:14px; text-decoration:none; border:1px solid var(--line);
                  padding:8px 14px; border-radius:8px; color:var(--fg); }
  .acoes-nota a:hover { border-color:var(--accent); color:var(--accent); }
  .aviso-prod { background:var(--err-bg); color:var(--err); padding:10px 16px;
                text-align:center; font-size:14px; font-weight:600; }

  /* A barra da empresa fica na tela o tempo todo, de proposito.
     Num escritorio que atende dezenas de CNPJs, a conversa rola e o nome da
     empresa escolhida sai de vista depois de tres respostas. Emitir na empresa
     errada nao e um erro de tela: e nota fiscal no CNPJ de outro cliente,
     assinada com o certificado dele. Entao o nome fica fixo, e em producao a
     barra inteira muda de cor. */
  .barra-empresa { position:sticky; top:0; z-index:5; display:flex; align-items:center;
                   gap:12px; padding:9px 20px; border-bottom:1px solid var(--line);
                   background:var(--card); font-size:14px; }
  .barra-empresa .rot { font-size:11px; text-transform:uppercase; letter-spacing:.09em;
                        color:var(--texto-3); }
  .barra-empresa .nome { font-weight:650; letter-spacing:-.1px; }
  .barra-empresa .doc { color:var(--muted); font-size:13px; }
  .barra-empresa .amb { margin-left:auto; font-size:11.5px; font-weight:700;
                        text-transform:uppercase; letter-spacing:.06em;
                        padding:3px 10px; border-radius:20px;
                        background:var(--line); color:var(--muted); }
  .barra-empresa button { background:none; border:1px solid var(--line); cursor:pointer;
                          padding:5px 11px; border-radius:8px; color:var(--muted);
                          font-size:12.5px; font-family:inherit; }
  .barra-empresa button:hover { border-color:var(--accent); color:var(--accent); }
  .barra-empresa.producao { background:var(--err-bg); border-bottom-color:var(--err); }
  .barra-empresa.producao .nome,
  .barra-empresa.producao .rot { color:var(--err); }
  .barra-empresa.producao .amb { background:var(--err); color:#fff; }

  .busca-empresa { width:100%; padding:10px 13px; border:1px solid var(--line);
                   border-radius:10px; font-size:14px; font-family:inherit;
                   background:var(--bg); color:var(--fg); margin-bottom:10px; }
</style>
</head>
<body>

<header>
  <div class="logo">NF</div>
  <div>
    <h1>Emitir NFS-e</h1>
    <div class="sub">NFS-e Gateway</div>
  </div>
  <span class="spacer"></span>
  <span id="quemSou" style="font-size:13px;color:var(--muted)"></span>
  <a class="link" href="/admin">‹ Voltar ao painel</a>
</header>

<div id="barraEmpresa" class="barra-empresa" hidden>
  <div>
    <div class="rot">Emitindo por</div>
    <div><span class="nome" id="beNome"></span> <span class="doc" id="beDoc"></span></div>
  </div>
  <span class="amb" id="beAmbiente"></span>
  <button id="beTrocar" type="button">Trocar empresa</button>
</div>

<main id="conversa"></main>

<div class="entrada">
  <div class="entrada-inner">
    <input id="campo" placeholder="Digite aqui..." autocomplete="off">
    <button id="enviar">Enviar</button>
  </div>
  <div class="dica" id="dica"></div>
</div>

<script src="/assets/valorbr.js"></script>
<script src="/assets/emitir.js"></script>
</body>
</html>
