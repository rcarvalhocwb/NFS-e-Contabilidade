name: Publicar release

# Fecha o ciclo da atualização automática. Ao marcar uma versão (uma tag como
# v1.9.2), este fluxo compila o instalador no Windows e publica uma GitHub
# Release com o .exe anexado e o SHA-256 no corpo — exatamente o que o
# verificador do painel (src/services/atualizacao.js) procura em
# /releases/latest. Como o repositório é público, o gateway do cliente baixa
# sem token, avisa "nova versão" e um clique atualiza em-place (sem perder
# dados: o instalador entra em modo atualização).
#
# A correção do produto sai testada pelo CI do branch ANTES da tag; aqui só se
# compila e publica o que já passou.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a publicar (ex: v1.9.2). Precisa existir.'
        required: true

permissions:
  contents: write   # criar a release e anexar o .exe neste mesmo repositório

jobs:
  publicar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: A tag bate com a versão do package.json?
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ github.event.inputs.tag }}'
          if (-not $tag) { $tag = '${{ github.ref_name }}' }
          $tagVersao = $tag -replace '^v', ''
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Write-Host "tag=$tag  package.json=$pkg"
          if ($tagVersao -ne $pkg) {
            throw "A tag ($tagVersao) não bate com a versão do package.json ($pkg). " +
                  "O verificador compara a tag com a versão embutida — publicar assim " +
                  "faria o cliente baixar um .exe que se diz outra versão."
          }

      - run: npm ci

      - name: Instalar o Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Montar o pacote e compilar o .exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\instalador\preparar-pacote.ps1 -SemBanco
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC não encontrado em $iscc" }
          & $iscc .\instalador\nfse-gateway.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC falhou ($LASTEXITCODE)" }

      - name: Calcular o SHA-256
        id: sha
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem instalador\saida\*.exe | Select-Object -First 1
          if (-not $exe) { throw 'Nenhum .exe em instalador\saida' }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          Write-Host "arquivo: $($exe.Name)"
          Write-Host "sha256:  $hash"
          "sha=$hash"          | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "exe=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "nome=$($exe.Name)"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publicar a release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ github.event.inputs.tag }}'
          if (-not $tag) { $tag = '${{ github.ref_name }}' }
          # O corpo LEVA o SHA-256 num formato que o verificador do painel casa
          # (regex SHA-256: <64 hex> em src/services/atualizacao.js).
          $notas = @"
          Instalador do NFS-e Gateway.

          Para atualizar uma instalação existente, rode este .exe por cima: ele
          entra em modo atualização — faz backup do banco, troca os arquivos,
          roda as migrações e sobe de volta, sem tocar nas suas empresas,
          certificados, notas nem no .env.

          Arquivo: ${{ steps.sha.outputs.nome }}
          SHA-256: ${{ steps.sha.outputs.sha }}
          "@
          $notas | Out-File notas-release.md -Encoding utf8
          gh release create $tag "${{ steps.sha.outputs.exe }}" `
            --title $tag --notes-file notas-release.md
