name: Instalador Windows

# Por que existe: o gateway roda no Windows da contabilidade, mas o
# desenvolvimento roda em Linux. Coisas que só aparecem no Windows — EPERM ao
# escrever em Arquivos de Programas, o parse dos .ps1, o assistente do Inno,
# a semântica de letra de unidade — passavam batido. Foi assim que um
# instalador quebrado chegou à contabilidade sem ninguém ver.
#
# A divisão de trabalho é de propósito: a suíte inteira roda no LINUX (onde ela
# foi escrita e é o gate verde); o WINDOWS roda o que só faz sentido lá — a
# semântica de caminho, a instalação limpa contra um banco real, e a compilação
# e execução do próprio instalador.
#
# Fecha também o ciclo da atualização automática: em workflow_dispatch, o job
# "publicar" pega o .exe recém-compilado e cria uma GitHub Release com ele
# anexado e o SHA-256 no corpo — o que o verificador do painel
# (src/services/atualizacao.js) procura em /releases/latest. Como o repositório
# é público, o gateway do cliente baixa sem token, avisa "nova versão", e um
# clique atualiza em-place. Fica aqui, e não num workflow à parte, porque o
# proxy de egresso bloqueia empurrar tags (HTTP 403) e um workflow_dispatch só
# existe para a API se o arquivo estiver no branch padrão — este já está.

on:
  # push só nos branches "de verdade": num branch com PR aberto, o evento
  # pull_request já cobre, e listar os dois faria o runner rodar em dobro.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: instalador-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------ 1. suíte (Linux)
  # O gate. Roda tudo; as duas provas de caminho do Windows se pulam aqui, e as
  # de banco se pulam sem TEST_DATABASE_URL.
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  # ------------------------------------------- 2. ensaio + caminho (Windows)
  # Instalação limpa ponta a ponta (migrações, escritório, admin, primeira
  # empresa, conversa do WhatsApp), a matriz de acesso e a semântica de caminho
  # do Windows (letra de disco / UNC), contra um PostgreSQL real.
  ensaio:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Semântica de caminho no Windows
        shell: pwsh
        run: node --test test/copia-backup.test.js

      - name: Subir o PostgreSQL do runner
        shell: pwsh
        run: |
          $svc = Get-Service -Name 'postgresql*' | Select-Object -First 1
          if (-not $svc) { throw 'PostgreSQL não encontrado no runner.' }
          Set-Service -Name $svc.Name -StartupType Manual
          Start-Service $svc.Name

      - name: Ensaio de instalação (32/32)
        shell: pwsh
        env:
          DATABASE_URL: postgresql://postgres:root@localhost:5432/postgres
          GATEWAY_API_KEY: chave-de-maquina-para-o-ci-000000
          MASTER_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
          PERMITIR_PRODUCAO: 'false'
        run: node scripts/ensaio-instalacao.js

      - name: Matriz de acesso (rotas x credenciais)
        shell: pwsh
        env:
          DATABASE_URL: postgresql://postgres:root@localhost:5432/postgres
          ADMIN_DATABASE_URL: postgresql://postgres:root@localhost:5432/postgres
          GATEWAY_API_KEY: chave-de-maquina-para-o-ci-000000
          MASTER_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
          PERMITIR_PRODUCAO: 'false'
        run: node scripts/matriz-acesso.js

  # -------------------------------------------------- 3. o instalador de fato
  # Monta o pacote, compila o .exe com o Inno Setup, publica como artefato e —
  # o que o Linux não alcança — RODA o configurar.ps1 de verdade: prova que o
  # administrador nasce na instalação (a tela da chave não aparece), que as
  # chaves saem no formato do gerador criptográfico, e que log, backup e
  # WhatsApp resolvem para ProgramData, nunca para Arquivos de Programas.
  instalador:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Instalar o Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Subir o PostgreSQL do runner
        shell: pwsh
        run: |
          $svc = Get-Service -Name 'postgresql*' | Select-Object -First 1
          if (-not $svc) { throw 'PostgreSQL não encontrado no runner.' }
          Set-Service -Name $svc.Name -StartupType Manual
          Start-Service $svc.Name

      - name: Montar o pacote
        shell: pwsh
        run: .\instalador\preparar-pacote.ps1 -SemBanco

      - name: Compilar o instalador (.exe)
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC não encontrado em $iscc" }
          & $iscc .\instalador\nfse-gateway.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC falhou ($LASTEXITCODE)" }
          Get-ChildItem instalador\saida\*.exe | Format-List Name, Length

      - name: Publicar o .exe como artefato
        uses: actions/upload-artifact@v4
        with:
          name: nfse-gateway-setup
          path: instalador/saida/*.exe
          if-no-files-found: error

      # --- o teste que o Linux não alcança: rodar configurar.ps1 de verdade ---
      - name: Provar o configurar.ps1 (admin criado, sem EPERM)
        shell: pwsh
        env:
          PGPASSWORD: root
        run: |
          $ErrorActionPreference = 'Stop'
          $raiz = (Get-Location).Path

          # 1) banco limpo para esta prova
          $pgbin = (Get-ChildItem 'C:\Program Files\PostgreSQL\*\bin\psql.exe' | Select-Object -First 1).DirectoryName
          & "$pgbin\psql" -U postgres -h localhost -c "DROP DATABASE IF EXISTS nfse_ci;"
          & "$pgbin\psql" -U postgres -h localhost -c "CREATE DATABASE nfse_ci;"
          $banco = 'postgresql://postgres:root@localhost:5432/nfse_ci'

          # 2) as respostas que o assistente coletaria (arquivo, como no .exe)
          $respostas = @{
            Modo         = 'nova'
            BancoUrl     = $banco
            NomeUsuario  = 'Administrador CI'
            EmailUsuario = 'ci@teste.local'
            SenhaUsuario = 'senha-de-teste-1234'
            Porta        = 3000
            LiberarFirewall = $false
            Comissionar  = $false
          } | ConvertTo-Json
          $arqResp = Join-Path $env:RUNNER_TEMP 'respostas.json'
          Set-Content -Path $arqResp -Value $respostas -Encoding utf8

          # 3) roda o MESMO script que o instalador chama
          & .\instalador\configurar.ps1 -Raiz $raiz -Respostas $arqResp -Modo nova
          if ($LASTEXITCODE -ne 0) { throw "configurar.ps1 falhou ($LASTEXITCODE)" }

          # 4) o .env saiu com chaves de tamanho certo (prova o New-ChaveHex)
          $envTxt = Get-Content (Join-Path $raiz '.env') -Raw
          if ($envTxt -notmatch '(?m)^MASTER_KEY=([0-9a-f]{64})\s*$') {
            throw 'MASTER_KEY não tem 64 hex — o gerador criptográfico falhou.'
          }
          if ($envTxt -notmatch '(?m)^GATEWAY_API_KEY=[0-9a-f]{48}\s*$') {
            throw 'GATEWAY_API_KEY fora do formato esperado.'
          }
          Write-Host 'OK: .env com chaves criptográficas no formato certo.'

          # 5) o administrador foi criado -> a tela da chave NÃO aparece
          $temDono = & node -e "require('dotenv').config();require('./src/services/usuarios').existeAlgum().then(t=>{process.stdout.write(t?'sim':'nao');process.exit(0)}).catch(e=>{console.error(e);process.exit(2)})"
          if ($temDono -ne 'sim') { throw "Admin NÃO foi criado na instalação (existeAlgum=$temDono) — a tela de primeiro acesso apareceria." }
          Write-Host 'OK: administrador criado na instalação; sem tela de chave.'

      - name: Provar que não há EPERM em Arquivos de Programas
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # No Windows, a pasta de dados graváveis tem de resolver para
          # ProgramData, nunca para a pasta de instalação (só-leitura sem admin).
          $saida = & node -e "const d=require('./src/util/dados'); console.log(JSON.stringify({logs:d.pastaLogs(),bk:d.pastaBackups(),wa:d.pastaWhatsapp()}))"
          Write-Host $saida
          $j = $saida | ConvertFrom-Json
          foreach ($p in @($j.logs, $j.bk, $j.wa)) {
            if ($p -notmatch 'ProgramData') { throw "Pasta gravável fora de ProgramData: $p" }
            if ($p -match 'Program Files') { throw "Pasta gravável dentro de Arquivos de Programas: $p (EPERM na certa)" }
          }
          Write-Host 'OK: logs, backups e WhatsApp resolvem para ProgramData.'

  # ------------------------------------------------ 4. publicar a release
  # Só quando pedido de propósito (workflow_dispatch): pega o .exe que o job
  # "instalador" compilou e provou, e publica a GitHub Release que o painel do
  # cliente enxerga. A versão vem do package.json — uma verdade só — e o corpo
  # leva o SHA-256 no formato exato que o verificador casa
  # (regex "SHA-256: <64 hex>" em src/services/atualizacao.js). Idempotente:
  # re-rodar sobre uma release existente só re-anexa o .exe e reescreve as notas.
  publicar:
    needs: instalador
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write   # criar a tag, a release e anexar o .exe
    steps:
      - uses: actions/checkout@v4

      - name: Baixar o .exe compilado
        uses: actions/download-artifact@v4
        with:
          name: nfse-gateway-setup
          path: dist

      - name: Definir a tag (a partir do package.json)
        id: versao
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$pkg"
          Write-Host "versão=$pkg  tag=$tag"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Calcular o SHA-256
        id: sha
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem dist\*.exe | Select-Object -First 1
          if (-not $exe) { throw 'Nenhum .exe no artefato baixado.' }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          Write-Host "arquivo: $($exe.Name)  sha256: $hash"
          "sha=$hash"            | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "exe=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "nome=$($exe.Name)"    | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publicar a release (cria a tag se preciso)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ steps.versao.outputs.tag }}'
          $notas = @"
          Instalador do NFS-e Gateway.

          Para atualizar uma instalação existente, rode este .exe por cima: ele
          entra em modo atualização — faz backup do banco, troca os arquivos,
          roda as migrações e sobe de volta, sem tocar nas suas empresas,
          certificados, notas nem no .env.

          Arquivo: ${{ steps.sha.outputs.nome }}
          SHA-256: ${{ steps.sha.outputs.sha }}
          "@
          $notas | Out-File notas-release.md -Encoding utf8

          # Idempotente: se a release já existir (re-run), só atualiza o anexo.
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "${{ steps.sha.outputs.exe }}" --clobber
            gh release edit   $tag --notes-file notas-release.md
          } else {
            gh release create $tag "${{ steps.sha.outputs.exe }}" `
              --target $env:GITHUB_SHA --title $tag --notes-file notas-release.md
          }
          Write-Host "Release $tag publicada."
