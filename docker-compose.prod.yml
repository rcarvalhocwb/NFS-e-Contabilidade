# Execução em produção com banco gerenciado (Supabase, RDS, etc.).
# Para desenvolvimento com Postgres local, use o docker-compose.yml.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Todas as variáveis vêm do .env — que NÃO vai para o repositório nem para a
# imagem (está no .gitignore e no .dockerignore).

services:
  gateway:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      TZ: America/Sao_Paulo
      # Atrás de proxy reverso / load balancer
      TRUST_PROXY: "true"
    ports:
      # Publica só em loopback: quem expõe à internet é o proxy reverso, que
      # termina o TLS. Sem isso a porta ficaria acessível sem HTTPS.
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
